name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc libgl1-mesa-dev xorg-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Format
        run: |
          make fmt
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Coverage
        run: make coverage
